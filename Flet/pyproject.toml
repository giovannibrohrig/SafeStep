    "flet-desktop==1.0.2",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.20",
    "markdown-it-py==4.2.0",
    "mdurl==0.1.2",
    "msgpack==1.2.3",
    "oauthlib==4.0.0",
    "pygments==2.21.0",
    "repath==0.9.0",
    "rich==15.0.0",
    "six==1.17.0",
    "sqlalchemy==2.1.1",
    "typing-extensions==4.16.0",
